name: バグ
description: 仕様どおりに動かない
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        「仕様どおりに動かない」ものをバグとします。仕様そのものを変えたい場合は「検討」の Issue にしてください。
  - type: textarea
    id: expected
    attributes:
      label: 期待する挙動
      description: 仕様（README）のどこに書いてある挙動か、リンクと一緒に。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の挙動
      description: スクリーンショットやログがあれば貼ってください。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. 
        2. 
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 環境
      placeholder: Xcode 27.0 / iOS 27.0 シミュレータ（iPhone 17）
