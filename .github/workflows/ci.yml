name: ci

# Lint と Build / Test。必須チェックにするのは、集約ジョブの ci-status だけ（ADR-0013）。
#
# main への push では走らせない。ルールセットが strict（main に追いついていないとマージできない）で、
# マージ方法も merge commit だけなので、マージコミットのツリーは PR で CI が通った head と同じになる。
# main で同じものを再テストしても得るものがない。
#
# on.pull_request.paths は使わない。ワークフローごと飛ぶと、必須チェックの ci-status が
# Pending のまま残ってマージできなくなる（GitHub Docs「Troubleshooting required status checks」）。
# 代わりに changes ジョブで変更ファイルを調べ、ジョブ単位で if で飛ばす。
# 条件で skipped になったジョブは成功として扱われる。
on:
  pull_request:
    branches: [main]

permissions: {}

# 同じ PR の古い実行は止める
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # GitHub のプレビューイメージ xcode-27 に入っている Xcode
  DEVELOPER_DIR: /Applications/Xcode_27.2.app

jobs:
  # 変更ファイルから、重いジョブを走らせるかを決める。PR のコードは取得も実行もしない。
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # 変更ファイルの取得に使う
      pull-requests: read
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - id: filter
        name: 変更ファイルを調べる
        env:
          # スクリプトインジェクションを避けるため、${{ }} を run に直接埋めず env 経由で渡す
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # リネーム前のパスも見る（Swift のファイルを docs などに移したときに取りこぼさないため）。
          # 1 ページ最大 100 件、全体で 3000 件まで取れる（GitHub Docs: List pull request files）
          files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" | jq -s 'add // []')
          names=$(printf '%s' "$files" \
            | jq -r '.[] | [.filename, (.previous_filename // empty)][]' \
            | sort -u)

          # lint / build-test の対象。.swift には Package.swift と scripts/ 内の Swift も含まれる。
          # ci.yml 自身の変更でも走らせて、この判定の変更を PR で確かめられるようにする。
          swift_re='\.swift$|(^|/)Package\.resolved$|^app/|__Snapshots__/|^mise\.toml$|^\.swiftlint\.yml$|^\.swift-format$|^\.github/workflows/ci\.yml$'
          # lint だけ走らせる対象（actionlint のため）
          workflows_re='^\.github/workflows/|^\.github/actionlint\.yaml$'

          # 上限（3000 件）に達した PR は取りこぼしの恐れがあるので、Swift に関わるものとして倒す
          file_count=$(printf '%s' "$files" | jq 'length')
          truncated=false
          [ "$file_count" -ge 3000 ] && truncated=true

          swift_hits=$(printf '%s\n' "$names" | grep -E "$swift_re" || true)
          workflows_hits=$(printf '%s\n' "$names" | grep -E "$workflows_re" || true)

          swift=false
          workflows=false
          [ -n "$swift_hits" ] && swift=true
          [ "$truncated" = true ] && swift=true
          [ -n "$workflows_hits" ] && workflows=true

          echo "swift=$swift"
          printf '%s\n' "$swift_hits"
          echo "workflows=$workflows"
          printf '%s\n' "$workflows_hits"

          echo "swift=$swift" >> "$GITHUB_OUTPUT"
          echo "workflows=$workflows" >> "$GITHUB_OUTPUT"

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.swift == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - run: mise run lint

  build-test:
    name: build-test
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      # シミュレーターの起動を、xcodebuild のビルド（約 2 分）と並行して始める。
      # 起動を待たずにテストへ進むと、「Testing started」から最初のテストまでログの出ない約 4 分があり、
      # シミュレーターの起動待ちと見ている（PR #52 の実行で測定）。先に起動しておけば、その待ちをビルドと重ねられる。
      # 端末と OS は mise.toml の [vars] pokedex_destination と同じにする。変えるときは両方を揃える。
      - name: シミュレーターをバックグラウンドで起動する
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j \
            | jq -r '.devices["com.apple.CoreSimulator.SimRuntime.iOS-27-2"][]? | select(.name == "iPhone 17") | .udid' \
            | head -n 1)
          if [ -z "$udid" ]; then
            echo "iOS 27.2 の iPhone 17 が見つからない" >&2
            exit 1
          fi
          echo "udid=$udid"
          log="$RUNNER_TEMP/simulator-boot.log"
          # bootstatus -b は、未起動なら起動して、起動しきるまで待つ
          nohup bash -c '
            echo "start $(date -u +%FT%TZ)" > "$1"
            xcrun simctl bootstatus "$2" -b >> "$1" 2>&1
            echo "end $(date -u +%FT%TZ)" >> "$1"
          ' _ "$log" "$udid" > /dev/null 2>&1 &
      # 参照画像は CI で撮り直さない。差があれば失敗にする（ADR-0020）。
      - run: mise run test
        env:
          TEST_RUNNER_SNAPSHOT_TESTING_RECORD: never
      - run: mise run check-warnings
      # 並行起動の効果を測るため、起動の開始と終了の時刻を出す。テストの開始時刻と見比べる。
      - name: シミュレーターの起動ログを表示する
        if: always()
        run: cat "$RUNNER_TEMP/simulator-boot.log" || true

  ci-status:
    name: ci-status
    needs: [changes, lint, build-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # changes は必ず success。lint と build-test は success か skipped（対象外で飛ばした）なら成功。
      # failure、cancelled、changes の skipped などは失敗にする。
      - name: 全ジョブの結果を確認する
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          BUILD_TEST: ${{ needs.build-test.result }}
        run: |
          echo "changes: $CHANGES, lint: $LINT, build-test: $BUILD_TEST"
          [ "$CHANGES" = "success" ] || exit 1
          for r in "$LINT" "$BUILD_TEST"; do
            case "$r" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
