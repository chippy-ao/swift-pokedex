# ラベルの定義。main に push すると label-sync ワークフローが GitHub に同期する。
# ここに無いラベルは削除されるので、ラベルは GitHub の画面ではなくこのファイルで管理する。
- name: task
  color: "#a2eeef"
  description: 機能の実装、開発基盤の作業（テンプレート「機能・タスク」）
  from_name: enhancement
- name: decision
  color: "#d876e3"
  description: 方針や仕様を決める議論（テンプレート「検討」）
  from_name: question
- name: bug
  color: "#d73a4a"
  description: 仕様（README）どおりに動かない（テンプレート「バグ」）
- name: dependencies
  color: "#0366d6"
  description: 依存の更新（Renovate が付ける）
- name: type:feat
  color: "#5319e7"
  description: PR の type が feat（新機能）
- name: type:fix
  color: "#5319e7"
  description: PR の type が fix（バグ修正）
- name: type:docs
  color: "#5319e7"
  description: PR の type が docs（ドキュメントのみの変更）
- name: type:style
  color: "#5319e7"
  description: PR の type が style（動作に影響しない整形）
- name: type:refactor
  color: "#5319e7"
  description: PR の type が refactor（動作を変えない内部の整理）
- name: type:perf
  color: "#5319e7"
  description: PR の type が perf（性能の改善）
- name: type:test
  color: "#5319e7"
  description: PR の type が test（テストの追加・修正）
- name: type:build
  color: "#5319e7"
  description: PR の type が build（ビルドや依存の変更）
- name: type:ci
  color: "#5319e7"
  description: PR の type が ci（CI の設定の変更）
- name: type:chore
  color: "#5319e7"
  description: PR の type が chore（その他の雑務）
- name: type:revert
  color: "#5319e7"
  description: PR の type が revert（過去の変更の取り消し）
